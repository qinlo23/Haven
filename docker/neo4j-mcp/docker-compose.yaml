services:
  neo4j-mcp:
    # 使用与下列环境变量匹配的 Neo4j Cypher MCP 实现
    image: mcp/neo4j-cypher:latest
    container_name: neo4j-mcp
    restart: unless-stopped
    ports:
      - '8000:8000' # MCP HTTP 端点：/mcp/
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?请通过 --env-file 指定含 NEO4J_PASSWORD 的环境文件}
      NEO4J_DATABASE: neo4j
      NEO4J_TRANSPORT: http
      NEO4J_MCP_SERVER_HOST: 0.0.0.0
      NEO4J_MCP_SERVER_PORT: '8000'
      NEO4J_MCP_SERVER_PATH: /mcp/
      # 远程访问时加入实际域名或 IP；浏览器跨域访问时设置具体来源
      NEO4J_MCP_SERVER_ALLOWED_HOSTS: localhost,127.0.0.1,neo4j-mcp
      NEO4J_MCP_SERVER_ALLOW_ORIGINS: ''
      NEO4J_READ_ONLY: 'false'
    networks:
      - neo4j-net

# 复用 docker/neo4j 创建的网络和数据库，不再创建第二个 Neo4j
networks:
  neo4j-net:
    external: true
    name: haven-neo4j-net
