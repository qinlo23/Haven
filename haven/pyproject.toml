[project]
name = "haven"
version = "0.0.1"
description = "个人慢病管理智能体 — Haven 健健"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "managed-deepagents==0.10.1",
    # MDA 0.10.1 + Python 3.14 回归验证组合，升级需重跑完整闭环。
    "langchain[mcp]==1.4.9",
    "langchain-core==1.7.6",
    "langgraph==1.2.20",
    "deepagents==0.7.34",
    "langchain-deepseek>=1.1.1,<2.0.0",  # 上限 <2.1 因 2.1.x 移除弃用项；已有 cp314 轮子
    "sqlalchemy[asyncio]>=2.0.52,<2.1.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",                    # ≥0.31.0 才有 cp314 轮子，否则 3.14 退化成源码编译
    "pydantic-settings>=2.15.0",
    "mcp>=2.2.0,<3",                    # MDA 0.10 开发服务的 langchain[mcp] 要求
    "pyyaml>=6.0.3,<7",                 # 模型配置直接使用，不依赖传递安装
    "python-dotenv>=1.2.3,<2",           # CLI 加载 .env
]

[project.scripts]
haven = "haven.cli:main"

[tool.mda]
python-version = "3.14"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# MDA 在开发构建中将 SDK 改为 vendored runtime 的本地直接引用。
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/haven"]

[tool.hatch.build.targets.wheel.force-include]
"instructions.md" = "haven/resources/instructions.md"

[tool.hatch.build.targets.sdist]
include = ["src/haven", "instructions.md", "README.md", "pyproject.toml", "uv.lock", ".python-version", "agent.py", "identity.py", "tools", "tests"]

# 开发工具链 —— 不在生产部署中安装。
#   安装方式：uv sync --extra dev
[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
    "pyright>=1.1.400",
]


# ============================================================================
# ruff —— 语法检查 + 格式 + import 排序（三合一）
#   检查: ruff check .    格式化: ruff format .    修复: ruff check --fix .
# ============================================================================
[tool.ruff]
target-version = "py314"  # 实际运行 Python 3.14
line-length    = 100      # 屏幕竖排时可并排打开两个文件

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors —— 语法错误
    "W",      # pycodestyle warnings —— 风格警告
    "F",      # pyflakes —— 未使用的 import / 变量 / 逻辑错误
    "I",      # isort —— import 按标准库 → 第三方 → 本地分组排序
    "UP",     # pyupgrade —— 语法现代化（如 Optional[X] → X | None）
    "B",      # flake8-bugbear —— 常见错误模式（== None 应该用 is None）
    "SIM",    # flake8-simplify —— 过于复杂的条件判断可以简化
]
ignore = ["E501"]  # 行长交给 formatter 管，linter 不再报告

[tool.ruff.lint.isort]
known-first-party = ["haven"]  # 项目自身模块作为"第一方"排在第三方之后

[tool.ruff.format]
quote-style           = "double"  # 统一双引号
indent-style          = "space"   # 空格缩进
line-ending           = "lf"      # Unix 换行符
skip-magic-trailing-comma = false # 多行参数末尾保留尾逗号，方便 diff


# ============================================================================
# pyright —— 静态类型检查    检查: pyright .
#   typeCheckingMode = "basic": 比 "standard" 宽松，避免第三方 stub 不完整导致噪声误报
# ============================================================================
[tool.pyright]
pythonVersion      = "3.14"
typeCheckingMode   = "basic"       # 只报确定性的类型错误，不报缺少类型注解
include            = ["src", "tests", "agent.py", "identity.py", "tools"]
exclude = [
    ".mda",                        # MDA 编译产物，非项目源码
    ".venv",                       # 虚拟环境
    ".data",                       # 本地 SQLite 数据库文件目录
    "__pycache__",
    "evals",
]
# managed-deepagents 等第三方包无 stub，关闭缺失 stub / import 的警告
reportMissingTypeStubs    = false
reportMissingImports      = false
reportMissingTypeArgument = false  # 不报告第三方包内部的类型参数缺失
reportUnknownMemberType   = false  # 不报告第三方包内部的未知成员类型
